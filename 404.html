<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Redirecting…</title>
</head>
<body>
  <p>Redirecting…</p>
  <script>
    // GitHub Pages has no server-side rewrite for extensionless URLs. Map the
    // routes generated by Framer to the static HTML files in this export.
    (() => {
      const path = window.location.pathname;
      const normalized = path.replace(/^\//, '').replace(/\/$/, '');
      const routes = {
        'about': 'about.html',
        'projects': 'projects.html',
        'projects/adc-calibration-fpga': 'projects/projects_adc-calibration-fpga.html',
        'projects/file-system-fpga': 'projects/projects_file-system-fpga.html',
        'projects/network-packet-inspection': 'projects/projects_network-packet-inspection.html',
        'projects/summer-internhip-project': 'projects/projects_summer-internhip-project.html',
        'projects/uart-in-fpga': 'projects/projects_uart-in-fpga.html'
      };
      const route = Object.keys(routes).find((key) => normalized === key || normalized.endsWith('/' + key));
      const siteRoot = route ? normalized.slice(0, normalized.length - route.length) : '';
      const target = route ? routes[route] : null;
      if (target) {
        const root = siteRoot.replace(/^\//, '').replace(/\/$/, '');
        window.location.replace('/' + (root ? root + '/' : '') + target + window.location.search + window.location.hash);
      } else {
        window.location.replace('./index.html');
      }
    })();
  </script>
</body>
</html>
